<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TABIKUMI - AI旅行プランナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
  :root{
    --ink:#12213B;
    --ink-2:#1B3157;
    --mist:#EEF2F0;
    --panel:#FFFFFF;
    --teal:#157B77;
    --teal-deep:#0E5C59;
    --amber:#E7A63C;
    --coral:#D9614F;
    --text:#1D2624;
    --text-soft:#5B6663;
    --line:#DCE3DF;
    font-family:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--mist);color:var(--text);}
  .app{min-height:100vh;display:flex;background:var(--mist);}
  .display{font-family:'Zen Kaku Gothic New',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Rail ---------- */
  .rail{
    width:220px;flex-shrink:0;background:var(--ink);color:#EAF0EE;
    padding:28px 20px;display:flex;flex-direction:column;gap:6px;
  }
  .rail-brand{display:flex;align-items:baseline;gap:8px;margin-bottom:28px;}
  .rail-brand .mark{width:10px;height:10px;border-radius:2px;background:var(--amber);transform:rotate(45deg);}
  .rail-brand h1{font-size:15px;letter-spacing:.06em;margin:0;font-weight:700;}
  .rail-brand span{font-size:10px;color:#9FB3AC;letter-spacing:.12em;}
  .step-item{
    display:flex;gap:12px;align-items:flex-start;padding:12px 10px;border-radius:10px;
    cursor:default;position:relative;
  }
  .step-item.clickable{cursor:pointer;}
  .step-item .num{
    font-family:'JetBrains Mono',monospace;font-size:11px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:1px solid #3A5170;color:#9FB3AC;margin-top:1px;
  }
  .step-item.active .num{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:700;}
  .step-item.done .num{background:var(--teal);border-color:var(--teal);color:#fff;}
  .step-item .label{font-size:13px;line-height:1.5;}
  .step-item .label b{display:block;font-size:13.5px;font-weight:700;}
  .step-item .label small{color:#9FB3AC;font-size:11px;}
  .step-item.active .label b{color:#fff;}
  .rail-line{width:1px;height:14px;background:#3A5170;margin-left:21px;}
  .rail-foot{margin-top:auto;font-size:10.5px;color:#7C9089;line-height:1.6;letter-spacing:.02em;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:22px 36px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar h2{margin:0;font-size:20px;}
  .topbar p{margin:2px 0 0;font-size:12.5px;color:var(--text-soft);}
  .topbar-top{display:flex;align-items:center;gap:12px;}
  .content{flex:1;padding:32px 36px;overflow:auto;}
  .btn{
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:13.5px;
    padding:11px 22px;border-radius:8px;border:none;cursor:pointer;letter-spacing:.02em;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-deep);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-deep);}
  .btn-primary:disabled{background:#B7C4C0;box-shadow:0 3px 0 #98A6A1;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .row{display:flex;gap:12px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
  .field label{font-size:12px;font-weight:700;color:var(--text-soft);letter-spacing:.03em;}
  .field input{
    font-family:'Noto Sans JP',sans-serif;font-size:14.5px;padding:11px 13px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--text);outline:none;
  }
  .field input:focus{border-color:var(--teal);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;}
  .trip-summary{
    display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--text-soft);margin-bottom:22px;
  }
  .trip-summary b{color:var(--ink);font-family:'JetBrains Mono',monospace;}

  .search-row{display:flex;gap:10px;margin-bottom:18px;}
  .search-row input{flex:1;}
  .search-results{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;}
  .search-hit{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    border:1px solid var(--line);border-radius:9px;background:#fff;
  }
  .search-hit .name{font-size:14px;font-weight:500;}
  .search-hit .addr{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
  .mini-btn{
    font-size:12px;font-weight:700;border:none;background:var(--ink);color:#fff;padding:7px 14px;
    border-radius:6px;cursor:pointer;flex-shrink:0;
  }
  .mini-btn.remove{background:transparent;color:var(--coral);border:1px solid var(--coral);}
  .spot-list{display:flex;flex-direction:column;gap:8px;}
  .spot-chip{
    display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
    background:#F4F7F5;border-radius:9px;border:1px solid var(--line);
  }
  .spot-chip .idx{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:#fff;background:var(--teal);
    width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    margin-right:10px;
  }
  .empty-note{
    border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
    color:var(--text-soft);font-size:13px;
  }

  #map{height:440px;border-radius:12px;border:1px solid var(--line);}
  .leaflet-div-icon{background:transparent;border:none;}
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--coral);transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);
    border:2px solid #fff;
  }
  .pin span{transform:rotate(45deg);color:#fff;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .pin.day{background:var(--teal);}

  .warn-box{
    background:#FFF6E8;border:1px solid var(--amber);border-radius:10px;padding:18px 20px;margin-bottom:22px;
  }
  .warn-box .head{display:flex;gap:8px;align-items:center;font-weight:700;color:#8A5B0E;font-size:14px;margin-bottom:8px;}
  .warn-box .stats{display:flex;gap:22px;margin:12px 0;flex-wrap:wrap;}
  .warn-box .stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--ink);}
  .warn-box .stat span{font-size:11px;color:var(--text-soft);}
  .suggest-chip{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--amber);
    border-radius:8px;padding:9px 14px;font-size:12.5px;margin-top:6px;
  }

  .reminder-box{
    display:flex;align-items:flex-start;gap:12px;background:#F1EEFB;border-radius:10px;
    padding:14px 16px;margin-bottom:14px;
  }
  .reminder-box .icon-circle{
    width:32px;height:32px;border-radius:50%;background:#6B5FC7;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .reminder-box .body{flex:1;}
  .reminder-box .msg{font-size:13.5px;font-weight:500;color:#3D3577;margin-bottom:2px;}
  .reminder-box .sub{font-size:12px;color:#6B5FC7;line-height:1.5;}
  .reminder-box .action{
    font-size:12.5px;font-weight:700;color:#6B5FC7;text-decoration:underline;cursor:pointer;
    background:none;border:none;padding:0;margin-top:4px;display:inline-block;
  }
  .reminder-box .close{background:none;border:none;color:#9891C9;cursor:pointer;font-size:14px;flex-shrink:0;}

  .day-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .day-tab{
    padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-size:13px;font-weight:700;font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text-soft);
  }
  .day-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .day-title{font-size:16px;font-weight:700;margin-bottom:4px;}
  .day-sub{font-size:12px;color:var(--text-soft);margin-bottom:18px;}

  .timetable{position:relative;padding-left:14px;}
  .tt-row{position:relative;padding:0 0 26px 30px;}
  .tt-row:before{
    content:'';position:absolute;left:5px;top:6px;bottom:-6px;width:1px;
    background:repeating-linear-gradient(to bottom, var(--line) 0 4px, transparent 4px 8px);
  }
  .tt-row:last-child:before{display:none;}
  .tt-row.draggable{cursor:grab;}
  .tt-row.draggable:hover{background:#F4F7F5;border-radius:8px;}
  .tt-row.dragging{opacity:.4;}
  .tt-row.drag-over{border-top:2px solid var(--teal);}
  .tt-handle{display:inline-block;margin-right:6px;color:var(--line);font-size:13px;cursor:grab;user-select:none;}
  .tt-row.draggable:hover .tt-handle{color:var(--teal);}
  .tt-dot{position:absolute;left:0;top:2px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--teal);}
  .tt-dot.move{background:var(--mist);box-shadow:0 0 0 1.5px var(--line);}
  .tt-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-soft);margin-bottom:3px;}
  .tt-name{font-size:15px;font-weight:700;}
  .tt-move{font-size:12px;color:var(--text-soft);}
  .tt-note{font-size:12.5px;color:var(--text-soft);margin-top:4px;line-height:1.6;}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-size:13.5px;color:var(--text-soft);margin:0;}

  .footer-actions{display:flex;justify-content:space-between;margin-top:28px;}
  ::selection{background:var(--amber);color:var(--ink);}
  /* ---------- Mobile ---------- */
  .hamburger{
    display:none; align-items:center; justify-content:center;
    width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
    background:#fff;flex-shrink:0;cursor:pointer;font-size:18px;
  }
  .rail-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:90;}
  .rail-backdrop.show{display:block;}

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .hamburger{display:flex;}
    .rail{
      position:fixed;top:0;left:0;height:100vh;width:250px;
      transform:translateX(-100%);transition:transform .22s ease;z-index:100;
      box-shadow:6px 0 30px rgba(0,0,0,.3);
    }
    .rail.open{transform:translateX(0);}
    .main{width:100%;min-width:0;}
    .topbar{padding:16px 18px;gap:10px;flex-direction:column;align-items:flex-start;}
    .topbar h2{font-size:17px;}
    .topbar-top{display:flex;align-items:center;gap:12px;width:100%;}
    .content{padding:18px 16px;}
    .row{flex-direction:column;}
    .search-row{flex-direction:column;}
    .search-row input{width:100%;}
    #map{height:300px;}
    #day-map{width:100% !important;}
    .footer-actions{flex-direction:column;gap:10px;align-items:stretch;}
    .footer-actions .btn{width:100%;justify-content:center;}
    .trip-summary{font-size:11px;padding:8px 12px;width:100%;box-sizing:border-box;white-space:normal;line-height:1.6;}
    .day-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;}
    .day-tab{flex-shrink:0;}
  }
</style>

</head>
<body>
<div class="app">
  <div class="rail-backdrop" id="rail-backdrop"></div>
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============ STATE ============ */
const state = {
  view: 'wizard', // 'wizard' | 'history' | 'history-detail'
  step: 1,
  trip: { name:'', start:'', end:'', startPoint:null, startTime:'09:00', goalPoint:null, endTime:'18:00' }, // startPoint/goalPoint: {name, lat, lng} | null (未定)
  spots: [],           // {id, name, addr, lat, lng}
  searchQuery: '',
  searchResults: [],
  searching: false,
  searchError: null,
  searchSearched: false,
  hotelSearch: { target:null, query:'', results:[], searching:false, error:null, searched:false }, // target: 'start' | 'goal' | null
  plan: null,          // AI result
  planLoading: false,
  planError: null,
  activeDay: 0,
  map: null,
  mapMarkers: [],
  historyList: [],        // [{id,name,start,end,spotNames,savedAt}]
  historyLoading: false,
  currentTripSaved: false,
  savedNotice: null,
  _wizardBackup: null,
  _dismissedReminders: new Set(),
};

/* ============ HISTORY (backend-persisted) ============ */
function getUserId(){
  // 簡易的な匿名ユーザーID。本物のログインに置き換える場合はここを差し替える。
  let id = localStorage.getItem('tabikumi_user_id');
  if(!id){
    id = 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10);
    localStorage.setItem('tabikumi_user_id', id);
  }
  return id;
}

async function loadHistoryList(){
  state.historyLoading = true;
  try{
    const res = await fetch('/api/trips', { headers: { 'X-User-Id': getUserId() } });
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    state.historyList = data.trips;
  }catch(e){
    state.historyList = [];
  }
  state.historyLoading = false;
  renderAll();
}

async function saveTripToHistory(){
  if(!state.plan) return;
  try{
    const res = await fetch('/api/trips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-Id': getUserId() },
      body: JSON.stringify({
        name: state.trip.name, start: state.trip.start, end: state.trip.end,
        trip: state.trip, spots: state.spots, plan: state.plan
      })
    });
    if(!res.ok) throw new Error('failed');
    state.currentTripSaved = true;
    state.savedNotice = '旅の記録に保存しました';
    await loadHistoryList();
  }catch(e){
    state.savedNotice = '保存に失敗しました。もう一度お試しください。';
  }
  renderContentOnly();
}

async function deleteHistoryTrip(id){
  try{
    await fetch('/api/trips/'+id, { method: 'DELETE', headers: { 'X-User-Id': getUserId() } });
  }catch(e){}
  await loadHistoryList();
}

async function openHistoryDetail(id){
  try{
    const res = await fetch('/api/trips/'+id, { headers: { 'X-User-Id': getUserId() } });
    if(!res.ok) return;
    const record = await res.json();
    state._wizardBackup = { trip: state.trip, spots: state.spots, plan: state.plan, activeDay: state.activeDay, step: state.step, currentTripSaved: state.currentTripSaved };
    state.trip = record.trip; state.spots = record.spots; state.plan = record.plan; state.activeDay = 0;
    state.view = 'history-detail';
    renderAll();
  }catch(e){}
}

function closeHistoryDetail(){
  if(state._wizardBackup){
    state.trip = state._wizardBackup.trip; state.spots = state._wizardBackup.spots;
    state.plan = state._wizardBackup.plan; state.activeDay = state._wizardBackup.activeDay;
    state.step = state._wizardBackup.step; state.currentTripSaved = state._wizardBackup.currentTripSaved;
    state._wizardBackup = null;
  }
  state.view = 'history';
  renderAll();
}

function buildHistoryPromptContext(){
  if(!state.historyList.length) return '';
  const lines = state.historyList.slice(0,5).map(t=>`- ${t.name}（${t.start}〜${t.end}）: ${(t.spotNames||[]).join('、')}`);
  return lines.join('\n');
}

const STEPS = [
  {n:1, label:'旅行日程', sub:'いつ行く？'},
  {n:2, label:'確実な予定', sub:'外せない予定を登録'},
  {n:3, label:'気になるスポット', sub:'候補を登録'},
  {n:4, label:'地図で確認', sub:'位置関係をチェック'},
  {n:5, label:'AIプラン生成', sub:'AIが旅程を作成'},
  {n:6, label:'完成プラン', sub:'旅程＋ルート'},
];

/* ============ HELPERS ============ */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function daysBetween(a,b){ if(!a||!b) return 0; const d=(new Date(b)-new Date(a))/86400000; return d>=0? d+1 : 0; }
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function estMinutes(km){
  // 距離帯によって移動手段を仮定し直す。
  // 短距離は市内移動（車・徒歩・地下鉄）、中距離は高速道路・在来線特急、
  // 長距離（100km超）は新幹線・飛行機を想定した速度に切り替える。
  // これにより「大阪→東京を下道の車移動」のような非現実的な見積もりを防ぐ。
  let speed, overhead;
  if(km <= 20){        speed = 25;  overhead = 5;  } // 市内近距離
  else if(km <= 120){   speed = 55;  overhead = 10; } // 郊外・都市間（高速道路/特急）
  else {                speed = 150; overhead = 40; } // 長距離（新幹線・飛行機＋空港/駅アクセス）
  return Math.round((km/speed)*60 + overhead);
}
function fmtKm(km){ return km<1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km'; }

function resolveStopCoords(st){
  if(st.spotId==='START') return state.trip.startPoint;
  if(st.spotId==='GOAL') return state.trip.goalPoint;
  return state.spots.find(s=>s.id===st.spotId) || null;
}

function timeToMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function minutesToTime(m){ m=((m%1440)+1440)%1440; const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }

// AIの出力に頼らず、ユーザーがFIXED指定したスポットは確実にfixed:trueにしておく安全策
function enforceFixedFlags(plan){
  if(!plan || !plan.days) return;
  const fixedSpotIds = new Set(state.spots.filter(s=>s.status==='confirmed' && s.fixedDay && s.fixedTime).map(s=>s.id));
  plan.days.forEach(day=>{
    (day.stops||[]).forEach(st=>{
      if(st.spotId && fixedSpotIds.has(st.spotId)) st.fixed = true;
    });
  });
}

// ドラッグ&ドロップで並び替えた後、簡易的に到着/出発時刻と移動時間を再計算する。
// AIを再度呼ばず、既存の滞在時間(stayMinutes)とハーバサイン距離だけで見積もる軽量な再計算。
function recomputeDaySchedule(day){
  const stops = day.stops || [];
  let cursor = timeToMinutes(stops[0] && stops[0].arrive) ?? 9*60;
  for(let i=0;i<stops.length;i++){
    const st = stops[i];
    if(st.fixed){
      // 固定予定は時刻を上書きしない。以降の計算はこの固定時刻を起点に続ける
      cursor = timeToMinutes(st.arrive) ?? cursor;
    } else {
      st.arrive = minutesToTime(cursor);
    }
    const stay = st.stayMinutes!=null ? st.stayMinutes : 0;
    cursor += stay;
    if(!st.fixed) st.depart = minutesToTime(cursor);
    else cursor = timeToMinutes(st.depart) ?? cursor;
    if(i < stops.length-1){
      const a = resolveStopCoords(st), b = resolveStopCoords(stops[i+1]);
      if(a && b){
        const km = haversineKm(a,b);
        const mins = estMinutes(km);
        st.travelToNextKm = +km.toFixed(1);
        st.travelToNextMinutes = mins;
        st.estimated = true;
        st.note = (st.note ? st.note.replace(/（?並び替えにより再計算.*?）?$/,'').trim() : '') ;
        st.note = (st.note ? st.note+'　' : '') + '（並び替えにより再計算・概算）';
        cursor += mins;
      } else {
        st.travelToNextMinutes = null;
        st.travelToNextKm = null;
      }
    } else {
      st.travelToNextMinutes = null;
      st.travelToNextKm = null;
    }
  }
}

/* ============ RENDER: RAIL ============ */
function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML='';
  rail.appendChild(el(`
    <div class="rail-brand">
      <div class="mark"></div>
      <div><h1>TABIKUMI</h1><br><span>AI TRIP PLANNER</span></div>
    </div>
  `));
  const inWizard = state.view==='wizard';
  STEPS.forEach((s,i)=>{
    const status = inWizard ? (s.n < state.step ? 'done' : (s.n===state.step ? 'active' : '')) : '';
    const clickable = inWizard && s.n < state.step;
    const item = el(`
      <div class="step-item ${status} ${clickable?'clickable':''}">
        <div class="num">${inWizard && s.n < state.step ? '✓' : s.n}</div>
        <div class="label"><b>${s.label}</b><small>${s.sub}</small></div>
      </div>
    `);
    if(clickable) item.onclick=()=>{ state.view='wizard'; state.step=s.n; closeRail(); renderAll(); };
    rail.appendChild(item);
    if(i<STEPS.length-1) rail.appendChild(el(`<div class="rail-line"></div>`));
  });
  rail.appendChild(el(`<div class="rail-line"></div>`));
  const histItem = el(`
    <div class="step-item clickable ${state.view!=='wizard'?'active':''}">
      <div class="num">📖</div>
      <div class="label"><b>過去の旅行</b><small>記録を見返す</small></div>
    </div>
  `);
  histItem.onclick=()=>{ state.view='history'; closeRail(); loadHistoryList(); };
  rail.appendChild(histItem);
  rail.appendChild(el(`<div class="rail-foot">行きたい場所を入れるだけ。<br>並び順と日割りはAIにおまかせ。</div>`));
}

/* ============ MOBILE DRAWER ============ */
function openRail(){
  document.getElementById('rail').classList.add('open');
  document.getElementById('rail-backdrop').classList.add('show');
}
function closeRail(){
  const rail = document.getElementById('rail');
  const backdrop = document.getElementById('rail-backdrop');
  if(rail) rail.classList.remove('open');
  if(backdrop) backdrop.classList.remove('show');
}
function toggleRail(){
  const rail = document.getElementById('rail');
  if(rail && rail.classList.contains('open')) closeRail(); else openRail();
}

/* ============ STEP 2 ============ */
async function doSearch(q){
  if(!q || q.trim().length<1) return;
  state.searching=true; state.searchError=null; renderContentOnly();
  try{
    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    state.searchResults = data.results;
    state.searchSearched = true;
  }catch(e){
    state.searchResults = [];
    state.searchSearched = true;
    state.searchError = '検索に失敗しました。しばらくしてからもう一度お試しください。';
  }
  state.searching=false; renderContentOnly();
}

async function doHotelSearch(q){
  if(!q || q.trim().length<1) return;
  state.hotelSearch.searching=true; state.hotelSearch.error=null; renderContentOnly();
  try{
    const res = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    state.hotelSearch.results = data.results;
    state.hotelSearch.searched = true;
  }catch(e){
    state.hotelSearch.results = [];
    state.hotelSearch.searched = true;
    state.hotelSearch.error = '検索に失敗しました。しばらくしてからもう一度お試しください。';
  }
  state.hotelSearch.searching=false; renderContentOnly();
}

function renderPointRow(labelText, key, target, placeholder, icon, timeKey){
  const current = state.trip[key];
  const isOpen = state.hotelSearch.target === target;

  const box = el(`<div class="card" style="padding:16px 18px;margin-bottom:12px;"></div>`);
  const head = el(`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;"></div>`);
  head.appendChild(el(`<div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">${icon} ${labelText}</div>`));

  const timeInput = el(`<input type="time" value="${state.trip[timeKey]}" style="font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;width:104px;"/>`);
  timeInput.addEventListener('input', e=>{ state.trip[timeKey] = e.target.value; });
  head.appendChild(timeInput);
  box.appendChild(head);

  const body = el(`<div style="margin-top:12px;"></div>`);

  if(current){
    const row = el(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div style="font-size:14px;font-weight:700;">${current.name}</div>
      <div style="display:flex;gap:8px;flex-shrink:0;">

        <button class="mini-btn remove">未定に戻す</button>
      </div>
    </div>`);
    row.querySelectorAll('button')[0].onclick=()=>{ state.hotelSearch={target, query:'', results:[], searching:false}; renderContentOnly(); };
    row.querySelectorAll('button')[1].onclick=()=>{ state.trip[key]=null; renderContentOnly(); };
    body.appendChild(row);
  } else if(!isOpen){
    const row = el(`<div style="display:flex;gap:8px;align-items:center;">
      <span style="font-size:12px;color:var(--text-soft);">未定</span>
      <button class="mini-btn">検索して設定</button>
    </div>`);
    row.querySelector('button').onclick=()=>{ state.hotelSearch={target, query:'', results:[], searching:false}; renderContentOnly(); };
    body.appendChild(row);
  }

  if(isOpen){
    const searchWrap = el(`<div></div>`);
    const row = el(`<div class="search-row" style="margin-bottom:10px;">
      <input id="hs-input" placeholder="${placeholder}" value="${state.hotelSearch.query}"/>
      <button class="btn btn-primary" id="hs-go">検索</button>
    </div>`);
    searchWrap.appendChild(row);

    const results = el(`<div class="search-results" style="margin-bottom:0;"></div>`);
    if(state.hotelSearch.searching){
      results.appendChild(el(`<div class="empty-note">検索中…</div>`));
    } else if(state.hotelSearch.error){
      results.appendChild(el(`<div class="empty-note" style="border-color:var(--coral);color:var(--coral);">${state.hotelSearch.error}</div>`));
    } else if(state.hotelSearch.searched && state.hotelSearch.results.length===0){
      results.appendChild(el(`<div class="empty-note">該当する場所が見つかりませんでした。別のキーワードでお試しください。</div>`));
    } else {
      state.hotelSearch.results.forEach(r=>{
        const hit = el(`<div class="search-hit">
          <div><div class="name">${r.name}</div><div class="addr">${r.addr}</div></div>
          <button class="mini-btn">設定</button>
        </div>`);
        hit.querySelector('button').onclick=()=>{
          state.trip[key] = { name:r.name, lat:r.lat, lng:r.lng };
          state.hotelSearch = { target:null, query:'', results:[], searching:false, error:null, searched:false };
          renderContentOnly();
        };
        results.appendChild(hit);
      });
    }
    searchWrap.appendChild(results);

    const closeBtn = el(`<button class="mini-btn remove" style="margin-top:10px;">閉じる（未定のままにする）</button>`);
    closeBtn.onclick=()=>{ state.hotelSearch={target:null, query:'', results:[], searching:false, error:null, searched:false}; renderContentOnly(); };
    searchWrap.appendChild(closeBtn);
    body.appendChild(searchWrap);

    setTimeout(()=>{
      const input = document.getElementById('hs-input');
      const goBtn = document.getElementById('hs-go');

      goBtn.onclick=()=>{ state.hotelSearch.query=input.value; doHotelSearch(input.value); };
      input.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ state.hotelSearch.query=e.target.value; doHotelSearch(e.target.value); }

    },0);
  }

  box.appendChild(body);
  return box;
}

function findFixedTimeConflicts(){
  const fixed = state.spots.filter(s=>s.status==='confirmed' && s.fixedDay && s.fixedTime);
  const groups = {};
  fixed.forEach(s=>{
    const key = s.fixedDay+'@'+s.fixedTime;
    (groups[key] = groups[key]||[]).push(s.name);
  });
  return Object.entries(groups).filter(([k,names])=>names.length>1).map(([k,names])=>{
    const [day,time] = k.split('@');
    return `DAY${day} ${time}: ${names.join('、')}`;
  });
}

function tripDayOptions(){
  const n = daysBetween(state.trip.start, state.trip.end);
  const opts = [];
  for(let d=1; d<=n; d++){
    let label = 'DAY'+d;
    if(state.trip.start){
      const dt = new Date(state.trip.start);
      dt.setDate(dt.getDate() + (d-1));
      label += `（${dt.getMonth()+1}/${dt.getDate()}）`;
    }
    opts.push({value:d, label});
  }
  return opts.length ? opts : [{value:1, label:'DAY1'}];
}

function renderSpotSearchAndList(wrap, status){
  const isConfirmed = status==='confirmed';
  const listId = isConfirmed ? 'spot-list-confirmed' : 'spot-list-candidate';

  const resultsEl = wrap.querySelector('#s-results');
  if(state.searching){
    resultsEl.appendChild(el(`<div class="empty-note">検索中…</div>`));
  } else if(state.searchError){
    resultsEl.appendChild(el(`<div class="empty-note" style="border-color:var(--coral);color:var(--coral);">${state.searchError}</div>`));
  } else if(state.searchSearched && state.searchResults.length===0){
    resultsEl.appendChild(el(`<div class="empty-note">該当する場所が見つかりませんでした。別のキーワードでお試しください。</div>`));
  } else if(state.searchResults.length){
    state.searchResults.forEach(r=>{
      const already = state.spots.some(sp=>sp.name===r.name && sp.lat===r.lat);
      const row = el(`<div class="search-hit">
        <div><div class="name">${r.name}</div><div class="addr">${r.addr}</div></div>
        <button class="mini-btn">${already?'追加済み':'追加'}</button>
      </div>`);
      const btn = row.querySelector('button');
      if(already){ btn.disabled=true; btn.style.opacity=.5; }
      else btn.onclick=()=>{
        const spot = { id:'s'+Date.now()+Math.random().toString(36).slice(2,6), name:r.name, addr:r.addr, lat:r.lat, lng:r.lng, status };
        if(isConfirmed){
          const sameDayCount = state.spots.filter(s=>s.status==='confirmed' && (s.fixedDay||1)===1).length;
          const hour = Math.min(9 + sameDayCount*2, 20);
          spot.fixedDay = 1;
          spot.fixedTime = String(hour).padStart(2,'0')+':00';
        }
        state.spots.push(spot);
        renderContentOnly();
      };
      resultsEl.appendChild(row);
    });
  }

  const listEl = wrap.querySelector('#'+listId);
  const spots = state.spots.filter(s=>s.status===status);
  if(!spots.length){
    listEl.appendChild(el(`<div class="empty-note">${isConfirmed ? 'まだ登録されていません' : '候補はまだありません'}</div>`));
  } else if(isConfirmed){
    const dayOpts = tripDayOptions();
    spots.forEach((sp,i)=>{
      const row = el(`<div class="spot-chip" style="flex-wrap:wrap;gap:10px;">
        <div style="flex:1;min-width:140px;"><span class="idx">${i+1}</span>${sp.name}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <select class="day-select" style="font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);"></select>
          <input type="time" class="time-input" value="${sp.fixedTime||'10:00'}" style="font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);"/>
          <button class="mini-btn remove">削除</button>
        </div>
      </div>`);
      const daySelect = row.querySelector('.day-select');
      dayOpts.forEach(o=>{
        const opt = el(`<option value="${o.value}">${o.label}</option>`);
        if(o.value===(sp.fixedDay||1)) opt.selected = true;
        daySelect.appendChild(opt);
      });
      daySelect.onchange = ()=>{ sp.fixedDay = parseInt(daySelect.value,10); renderContentOnly(); };
      row.querySelector('.time-input').onchange = (e)=>{ sp.fixedTime = e.target.value; renderContentOnly(); };
      row.querySelector('.remove').onclick=()=>{ state.spots = state.spots.filter(x=>x.id!==sp.id); renderContentOnly(); };
      listEl.appendChild(row);
    });
  } else {
    spots.forEach((sp,i)=>{
      const row = el(`<div class="spot-chip">
        <div><span class="idx">${i+1}</span>${sp.name}</div>
        <button class="mini-btn remove">削除</button>
      </div>`);
      row.querySelector('button').onclick=()=>{ state.spots = state.spots.filter(x=>x.id!==sp.id); renderContentOnly(); };
      listEl.appendChild(row);
    });
  }

  wrap.querySelector('#s-go').onclick=()=>{ state.searchQuery = wrap.querySelector('#s-input').value; doSearch(state.searchQuery); };
  wrap.querySelector('#s-input').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ state.searchQuery=e.target.value; doSearch(e.target.value); }
  });
}

/* ============ STEP 4 : MAP ============ */
function renderStep4(){
  const wrap = el(`<div>
    <div id="map"></div>
    <div class="footer-actions">
      <button class="btn btn-ghost" id="back3">← 気になるスポットに戻る</button>
      <button class="btn btn-primary" id="to-step5">AIにプランを作らせる →</button>
    </div>
  </div>`);
  document.getElementById('content').appendChild(wrap);
  wrap.querySelector('#back3').onclick=()=>{ state.step=3; renderAll(); };
  wrap.querySelector('#to-step5').onclick=()=>{ state.step=5; renderAll(); };

  setTimeout(()=>{
    const mapDiv = document.getElementById('map');
    if(!mapDiv) return;
    const map = L.map(mapDiv);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors', maxZoom:18
    }).addTo(map);
    const bounds=[];
    state.spots.forEach((sp,i)=>{
      const isCandidate = sp.status==='candidate';
      const pinStyle = isCandidate ? 'background:#fff;border:2px dashed var(--teal);' : '';
      const numColor = isCandidate ? 'color:var(--teal);' : '';
      const icon = L.divIcon({html:`<div class="pin" style="${pinStyle}"><span style="${numColor}">${i+1}</span></div>`, iconSize:[26,26], iconAnchor:[13,26]});
      L.marker([sp.lat,sp.lng],{icon}).addTo(map).bindTooltip(sp.name + (isCandidate?'（候補）':''));
      bounds.push([sp.lat,sp.lng]);
    });
    if(state.trip.startPoint){
      const h=state.trip.startPoint;
      const icon = L.divIcon({html:`<div class="pin" style="background:var(--teal-deep);"><span>▶️</span></div>`, iconSize:[26,26], iconAnchor:[13,26]});
      L.marker([h.lat,h.lng],{icon}).addTo(map).bindTooltip('スタート地点：'+h.name);
      bounds.push([h.lat,h.lng]);
    }
    if(state.trip.goalPoint){
      const h=state.trip.goalPoint;
      const icon = L.divIcon({html:`<div class="pin" style="background:var(--ink);"><span>🏁</span></div>`, iconSize:[26,26], iconAnchor:[13,26]});
      L.marker([h.lat,h.lng],{icon}).addTo(map).bindTooltip('ゴール地点：'+h.name);
      bounds.push([h.lat,h.lng]);
    }
    if(bounds.length) map.fitBounds(bounds,{padding:[40,40]});
    else map.setView([43.06,141.35],7);
  },0);
}

/* ============ AI PLAN GENERATION ============ */
function distNodes(){
  // spots + optional start/goal nodes, all with a stable id, for matrix + prompt building
  const nodes = state.spots.map(s=>({id:s.id, name:s.name, lat:s.lat, lng:s.lng}));
  if(state.trip.startPoint) nodes.push({id:'START', name:state.trip.startPoint.name, lat:state.trip.startPoint.lat, lng:state.trip.startPoint.lng});
  if(state.trip.goalPoint) nodes.push({id:'GOAL', name:state.trip.goalPoint.name, lat:state.trip.goalPoint.lat, lng:state.trip.goalPoint.lng});
  return nodes;
}

function buildDistanceMatrix(){
  const nodes = distNodes();
  const m = {};
  nodes.forEach(a=>{
    m[a.id]={};
    nodes.forEach(b=>{
      if(a.id===b.id) return;
      const km = haversineKm(a,b);
      m[a.id][b.id] = { km: +km.toFixed(1), min: estMinutes(km) };
    });
  });
  return m;
}

  state.planLoading=true; state.planError=null; state.currentTripSaved=false; state.savedNotice=null; renderContentOnly();

  const distLines = [];
  nodes.forEach(a=>nodes.forEach(b=>{

  const system = `あなたは旅行プランナーAIです。与えられたスポットの緯度経度と移動時間データを使い、現実的な旅程を作成してください。

旅行全体の構造（重要・時系列で理解すること）:
DAY1は必ずSTART（または未確定なら提案エリア）からstart時刻に開始し、最終日はGOAL（または未確定なら最後のスポット）でend時刻頃に終わる。途中の夜（DAY(i)とDAY(i+1)の間、i=1〜最終日-1）の宿泊地は指定されていないので、AIが提案する。

ルール:
- 中間の日（DAY2〜最終日前）は09:00開始、18:00頃終了を目安にする。DAY1はSTARTタイム、最終日はGOALタイムを基準にする。
- 地理的に近いスポットを同じ日にグループ化する。日をまたぐ移動は最小化する。
- 各スポットの滞在時間は種類から妥当な値を推定する（例: テーマパーク90-120分、市場60分、展望台45-60分、公園60分など）。
- 昼食枠（type: meal, 60分程度）を各日1回、正午前後に挿入する。
- 総移動時間・総観光時間が旅行可能時間を上回る場合はfeasibleをfalseにし、warningに具体的な数値を明記する。

決定済み・候補（仮）スポットの優先順位（重要）:
- status:決定済み のスポットは必ず全日程のいずれかの日に含めること。時間が厳しくても、決定済みスポットを勝手に除外してはいけない。どうしても全日程に収まらない場合はfeasible:falseとし、warningでその旨を明記する（決定済みスポットを削るのではなく、正直に「無理」と伝える）。
- status:候補（仮） のスポットは、時間に余裕があれば含めてよい任意枠。時間が厳しい場合は、決定済みスポットより先に候補スポットを外すこと。
- 含めなかった候補スポットは、excludedCandidatesに{spotId, name, reason}の形で列挙する（reasonには「移動時間が長くなるため」等、具体的な理由を書く）。含めなかった候補が無ければ空配列[]にする。
- suggestion（削減提案）は、まだプランに入れている候補スポットがあればそれを外す提案を優先し、候補が無い/全部除外済みでもなお厳しい場合のみ、決定済みスポットについて言及してよい。

日時が固定された予定（最重要・必ず守ること）:
スポット一覧の中に「FIXED:day{N}@{HH:MM}」という注記が付いているものがある。これは「N日目の指定時刻に必ず訪問する」というユーザー自身が指定した確定予定であり、動かしてはいけない制約である。
- 該当するstopは、必ずその日（dayIndex=N）の中に配置し、arriveをその指定時刻に正確に一致させること。他の日に移動させたり、時刻をずらしたりしてはいけない。
- そのstopには"fixed": trueを設定すること。
- 同じ日の他の予定（時刻指定のない決定済みスポット・候補スポット・食事）は、この固定予定を軸にして、その前後の空き時間に無理なく収まるように配置すること。固定予定と時間が重なりそうな場合は、他の予定をその日から別の日に動かすか、除外を検討する（決定済みスポットは除外せず、警告で対応する）。
- 複数のFIXED予定が同じ日にあり、物理的に間に合わない（近すぎる時間に離れた場所が指定されている等）場合は、feasibleをfalseにし、warningでその旨を具体的に説明する。

スポットが少ない日の提案（daySuggestion）:
ある日に配置される実際のスポット（固定予定・候補由来のスポット）がゼロ、または1つしかなく「終日フリー」に近い状態になる場合、その日のdaySuggestionに、一般的な観光の提案を書いてよい。
- 前後の日のスポットの位置、宿泊エリア提案（stayAreaSuggestion/arrivalStaySuggestion）などから、その日がどのエリアにいる可能性が高いかを推測し、そのエリアで実在が確実な、広く知られた定番の観光地・過ごし方を2〜4件、itemsに{name, note}の形で挙げる。noteには「なぜそこが良いか」を一言添える。
- 存在に確信が持てない場所、マイナーすぎる場所、正確な住所や営業時間の詳細は書かないこと。有名で一般的な提案に留める。
- reasonには「〇〇エリアにいると想定されるため」のように、提案の前提を一言添える。
- これはあくまで参考提案であり、正式なスケジュールに組み込むものではない。スポットが十分にある日はdaySuggestionをnullにしてよい。

スタート・ゴール地点の扱い（重要）:
未確定の地点については、架空の場所を作文しない。代わりに登録済みスポットのいずれかを目印（anchorSpotId）にして「この辺りが合理的」という形でエリアを提案する。提案エリアの座標はanchorSpotIdのスポットの座標として扱ってよく、そこから隣接する予定までの移動時間は実際の距離データ（全ノード間の距離が提供されている）を使って計算できる。

【DAY1の始まり】
1. STARTが確定している場合: DAY1の最初のstopをtype:"hotel_start", spotId:"START", nameはその地点名、arriveはSTARTタイム。移動時間はSTART起点の距離データで正確に計算。estimated:false。arrivalStaySuggestionはnullでよい。
2. STARTが未定の場合: DAY1の最初のstopはtype:"hotel_start", spotId:null, nameは"出発地点未定"、arriveはSTARTタイムをそのまま使う（ユーザーが時刻は指定済みなので目安ではない）。noteに「出発地点の場所は未定のため、最初の移動時間は目安」と明記。estimated:true。arrivalStaySuggestionには、DAY1最初のスポット近くに集合するのが無難という提案（anchorSpotIdはDAY1最初のスポットのid）を設定する。

【中間の夜（DAY(i)とDAY(i+1)の間、i=1〜最終日-1）】
3. 最終日より前の日（DAY(i), i<最終日）は、その日の最後の観光スポットで終えてよく、type:"hotel_end"のstopは置かない。代わりに、DAY(i)のstayAreaSuggestionで、「DAY(i)最後に訪れるスポット」と「DAY(i+1)最初に訪れるスポット」の両方を考慮し、移動効率の良いエリアをanchorSpotIdとして提案する。
4. 翌日（DAY(i+1)）の最初のstopは、type:"hotel_start", spotId:null, nameを"宿泊地未定（提案エリア: {前日のareaName}）"とし、travelToNextMinutes/Kmは前日のanchorSpotIdから当日最初のスポットまでの実距離で計算する。

【最終日の終わり】
5. GOALが確定している場合: 最終日の最後のstopをtype:"hotel_end", spotId:"GOAL", nameはその地点名、departはGOALタイムとし、直前スポットからの移動時間をGOALとの距離データで正確に計算する。estimated:false。
6. GOALが未定の場合: 最終日は最後の観光スポットで終えてよい（type:"hotel_end"のダミーstopは追加しない）。ただしそのスポットのnoteに「終了目安: {GOALタイム}頃」と一言添える。

過去の旅行履歴（参考情報）:
ユーザーの過去の旅行履歴が渡される場合がある。渡された場合、行き先の傾向（自然系・都市観光・グルメなど）を軽く参考にし、関連性が高いと感じた場合のみ、該当する日のnoteやsuggestionに一言触れてよい（例：「前回の旅行でも自然スポットを中心に周られていたので、青い池は特におすすめです」）。無理に毎回言及する必要はなく、関連が薄い場合は何も触れなくてよい。`;

  const user = `旅行日数: ${nDays}日間 (${state.trip.start} 〜 ${state.trip.end})

スタート・ゴール地点:
${startLine}
${goalLine}

スポット一覧:
${spotLines}

移動時間（直線距離ベースの概算。20km以下は市内移動、20〜120kmは高速道路/特急、120km超は新幹線・飛行機を想定した速度で計算済み。実際の移動時間の概算値として扱ってよい。START/GOALが確定している場合はそれらとの距離も含む）:
${distLines.join('\n')}
${historyContext ? `\nユーザーの過去の旅行履歴（参考・任意で活用してよい）:\n${historyContext}\n` : ''}
上記データを元に、スキーマ通りのJSONで旅程を作成してください。`;



  try{
    const response = await fetch("/api/plan", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ system, user })
    });
    const data = await response.json();
    if(!response.ok) throw new Error(data.message || data.error || 'plan request failed');
    state.plan = data.plan;
    enforceFixedFlags(state.plan);
    state.activeDay = 0;
    state.step = 6;
  }catch(e){
    state.planError = 'プラン生成に失敗しました。もう一度お試しください。';
  }
  state.planLoading=false;
  renderAll();
}

function renderReminderBox({icon, msg, sub, actionLabel, onAction, dismissKey}){
  if(dismissKey && state._dismissedReminders && state._dismissedReminders.has(dismissKey)) return null;
  const box = el(`<div class="reminder-box">
    <div class="icon-circle">${icon}</div>
    <div class="body">
      <div class="msg">${msg}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
      ${actionLabel ? `<button class="action">${actionLabel}</button>` : ''}
    </div>
    <button class="close">✕</button>
  </div>`);
  if(actionLabel && onAction) box.querySelector('.action').onclick = onAction;
  box.querySelector('.close').onclick = ()=>{
    if(dismissKey){
      if(!state._dismissedReminders) state._dismissedReminders = new Set();
      state._dismissedReminders.add(dismissKey);
    }
    box.remove();
  };
  return box;
}

        ${st.travelToNextMinutes!=null ? `<div class="tt-move">↓ 移動 約${st.travelToNextMinutes}分${st.travelToNextKm!=null? ' ('+st.travelToNextKm+'km)':''}${st.estimated?'（概算）':''}</div>` : ''}
      </div>`);
      if(isReorderable){
        row.addEventListener('dragstart', e=>{
          dragFromIndex = idx;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', ()=>{
          row.classList.remove('dragging');
          tt.querySelectorAll('.tt-row').forEach(r=>r.classList.remove('drag-over'));
        });
        row.addEventListener('dragover', e=>{
          e.preventDefault();
          row.classList.add('drag-over');
        });
        row.addEventListener('dragleave', ()=>{ row.classList.remove('drag-over'); });
        row.addEventListener('drop', e=>{
          e.preventDefault();
          row.classList.remove('drag-over');
          if(dragFromIndex===null || dragFromIndex===idx) return;
          const arr = day.stops;
          const [moved] = arr.splice(dragFromIndex, 1);
          arr.splice(idx, 0, moved);
          recomputeDaySchedule(day);
          dragFromIndex = null;
          renderContentOnly();
        });
      }
      tt.appendChild(row);
    });
    if(!readOnly && (day.stops||[]).some(st=>st.type==='spot'||st.type==='meal')){
      tt.appendChild(el(`<div style="font-size:11.5px;color:var(--text-soft);margin-top:-8px;margin-bottom:16px;">⠿ を掴んでドラッグすると順番を入れ替えられます（移動時間は概算で再計算されます）</div>`));
    }
    gridWrap.appendChild(tt);

    if(day.stayAreaSuggestion){
      const sug = day.stayAreaSuggestion;
      const b = renderReminderBox({
        icon:'🌙', msg:`この夜の宿泊エリア提案：${sug.areaName}`,
        sub:sug.reason||'', dismissKey:'stay-suggestion-day'+day.dayIndex
      });
      if(b) tt.appendChild(b);
    }

    if(day.daySuggestion && day.daySuggestion.items && day.daySuggestion.items.length){
      const dsug = day.daySuggestion;
      const box = el(`<div class="reminder-box" style="background:#FFF6E8;">
        <div class="icon-circle" style="background:var(--amber);">💡</div>
        <div class="body">
          <div class="msg" style="color:#8A5B0E;">この日はまだ予定が少ないようです。AIからの一般的な提案</div>
          <div class="sub" style="color:#8A5B0E;margin-bottom:6px;">${dsug.reason||''}</div>
        </div>
      </div>`);
      const list = el(`<ul style="margin:0 0 12px;padding-left:0;list-style:none;"></ul>`);
      dsug.items.forEach(it=>{
        list.appendChild(el(`<li style="background:#fff;border:1px solid #F0DFB8;border-radius:8px;padding:10px 14px;margin-bottom:8px;">
          <div style="font-size:13.5px;font-weight:700;">${it.name}</div>
          <div style="font-size:12px;color:var(--text-soft);margin-top:2px;">${it.note||''}</div>
        </li>`));
      });
      const note = el(`<div style="font-size:11.5px;color:var(--text-soft);">※AIによる一般的な参考提案です（正確な位置情報を確認したものではありません）。気になるものがあれば「② 気になるスポット」から検索して追加し、作り直してください。</div>`);
      tt.appendChild(box);
      tt.appendChild(list);
      tt.appendChild(note);
    }

    const mapBox = el(`<div id="day-map" style="width:340px;height:360px;border-radius:12px;border:1px solid var(--line);flex-shrink:0;"></div>`);
    gridWrap.appendChild(mapBox);
    wrap.appendChild(gridWrap);

    setTimeout(()=>{
      const mapDiv = document.getElementById('day-map');
      if(!mapDiv) return;
      const map = L.map(mapDiv);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors', maxZoom:18}).addTo(map);
      const latlngs=[]; const bounds=[];
      (day.stops||[]).forEach((st,i)=>{
        let sp = null;
        if(st.spotId==='START') sp = state.trip.startPoint;
        else if(st.spotId==='GOAL') sp = state.trip.goalPoint;
        else sp = state.spots.find(s=>s.id===st.spotId);
        if(!sp) return; // undecided hotel or unresolved id: skip pin, keep timetable note as the source of truth
        const isHotel = st.type==='hotel_start' || st.type==='hotel_end';
        const icon = isHotel
          ? L.divIcon({html:`<div class="pin day" style="background:var(--ink);"><span>🏨</span></div>`, iconSize:[24,24], iconAnchor:[12,24]})
          : L.divIcon({html:`<div class="pin day"><span>${i+1}</span></div>`, iconSize:[24,24], iconAnchor:[12,24]});
        L.marker([sp.lat,sp.lng],{icon}).addTo(map).bindTooltip(st.name);
        latlngs.push([sp.lat,sp.lng]); bounds.push([sp.lat,sp.lng]);
      });
      if(latlngs.length>1) L.polyline(latlngs,{color:'#157B77', weight:3, dashArray:'6,6'}).addTo(map);
      const sugForMap = (state.activeDay===0 && !day.stayAreaSuggestion) ? p.arrivalStaySuggestion : day.stayAreaSuggestion;
      if(sugForMap && sugForMap.anchorSpotId){
        const anchor = state.spots.find(s=>s.id===sugForMap.anchorSpotId);
        if(anchor){
          const icon = L.divIcon({html:`<div class="pin day" style="background:var(--amber);"><span>🌙</span></div>`, iconSize:[24,24], iconAnchor:[12,24]});
          L.marker([anchor.lat,anchor.lng],{icon}).addTo(map).bindTooltip('宿泊エリア提案：'+sugForMap.areaName);
          bounds.push([anchor.lat,anchor.lng]);
        }
      }
      if(bounds.length) map.fitBounds(bounds,{padding:[30,30]}); else map.setView([43.06,141.35],7);
    },0);
  }

  const actions = el(`<div class="footer-actions"></div>`);
  if(readOnly){
    const backBtn = el(`<button class="btn btn-ghost">← 過去の旅行一覧に戻る</button>`);
    backBtn.onclick=closeHistoryDetail;
    actions.appendChild(backBtn);
  } else {
    const back4 = el(`<button class="btn btn-ghost">← 条件を変えて作り直す</button>`);
    back4.onclick=()=>{ state.step=5; renderAll(); };
    const restart = el(`<button class="btn btn-ghost">最初からやり直す</button>`);
    restart.onclick=()=>{
      Object.assign(state,{
        view:'wizard', step:1,
        trip:{name:'',start:'',end:'',startPoint:null,startTime:'09:00',goalPoint:null,endTime:'18:00'},
        spots:[], searchQuery:'', searchResults:[],
        plan:null, planError:null, activeDay:0, currentTripSaved:false, savedNotice:null, _dismissedReminders:new Set()
      });
      renderAll();
    };
    actions.appendChild(back4);
    actions.appendChild(restart);
  }
  wrap.appendChild(actions);
}

/* ============ HISTORY LIST VIEW ============ */
function renderHistoryList(){
  const wrap = el(`<div></div>`);
  document.getElementById('content').appendChild(wrap);

  if(state.historyLoading){
    wrap.appendChild(el(`<div class="loading"><div class="spinner"></div><p>読み込み中…</p></div>`));
    return;
  }

  const newBtn = el(`<button class="btn btn-primary" style="margin-bottom:22px;">＋ 新しい旅行を作る</button>`);
  newBtn.onclick=()=>{ state.view='wizard'; renderAll(); };
  wrap.appendChild(newBtn);

  if(!state.historyList.length){
    wrap.appendChild(el(`<div class="empty-note">まだ記録された旅行がありません。旅程を作って「記録に残す」と、ここに表示されます。</div>`));
    return;
  }

  const list = el(`<div style="display:flex;flex-direction:column;gap:12px;"></div>`);
  state.historyList.forEach(t=>{
    const card = el(`<div class="card" style="padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;">
      <div>
        <div style="font-size:15px;font-weight:700;margin-bottom:4px;">${t.name||'(名称未設定)'}</div>
        <div style="font-size:12.5px;color:var(--text-soft);margin-bottom:6px;">${t.start}〜${t.end} ・ スポット${t.spotCount||0}件</div>
        <div style="font-size:12px;color:var(--text-soft);">${(t.spotNames||[]).slice(0,5).join('、')}${(t.spotNames||[]).length>5?' 他':''}</div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="mini-btn" data-act="view">詳細を見る</button>
        <button class="mini-btn remove" data-act="del">削除</button>
      </div>
    </div>`);
    card.querySelector('[data-act="view"]').onclick=()=>openHistoryDetail(t.id);
    card.querySelector('[data-act="del"]').onclick=()=>{
      if(confirm(`「${t.name}」の記録を削除します。よろしいですか？`)) deleteHistoryTrip(t.id);
    };
    list.appendChild(card);
  });
  wrap.appendChild(list);
}

/* ============ RENDER ROOT ============ */
function renderContentOnly(){
  const content = document.getElementById('content');
  content.innerHTML='';
  if(state.view==='history'){ renderHistoryList(); return; }
  if(state.view==='history-detail'){ renderStep6(true); return; }
  ({1:renderStep1,2:renderStep2,3:renderStep3,4:renderStep4,5:renderStep5,6:renderStep6})[state.step]();
}
function renderAll(){
  renderRail();
  renderTopbar();
  renderContentOnly();
}
document.getElementById('rail-backdrop').addEventListener('click', closeRail);
renderAll();
loadHistoryList();
</script>
</body>
</html>
